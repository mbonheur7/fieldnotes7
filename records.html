<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recoeds | Campus Life Planner</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="scripts/app.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">skip to main content</a>

    <header class="site-header">
        <h1>Campus Life Planner</h1>
        <p>Plan your task, manage your time, and stay on top of campus life.</p>

        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="about.html">About</a></li>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="records.html" aria-current="page">Records</a></li>
                <li><a href="task-form.html">Add Task</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-footer">
        <p id="status-message" class="status-message" aria-live="polite"></p>

        <section id="records" class="panel">
            <h2>Records</h2>

            <div class="toolbar">
                <div class="form-group">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" placeholder="^Essay or 2026-10">

                    <p id="search-error" class="error-text" role="alert"></p>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="search-case" checked>
                    <label for="search-case">Ignore UPPER/lower case</label>
                </div>
                <div class="form-group">
                    <label for="filter-status">Show</label>
                    <select id="filter-status">
                        <option value="all">All tasks</option>
                        <option value="incomplete">Incomplete only</option>
                        <option value="completed">Completed only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter-tag">Tag</label>
                    <select id="filter-tag"><option value="all">All tags</option></select>
                </div>
                <div class="form-group">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="due-asc">Due date: earliest first</option>
                        <option value="due-desc">Due date: latest first</option>
                        <option value="title-asc">Title: A to Z</option>
                        <option value="title-desc">Title: Z to A</option>
                        <option value="duration-asc">Duration: shortest first</option>
                        <option value="duration-desc">Duration: longest first</option>
                    </select>
                </div>
            </div>

            <p id="result-count" class="hint"></p>
            <ul id="task-list" class="task-list"></ul>
        </section>

        <footer class="site-footer">
            <p><strong>Your Fieldnotes</strong></p>
        </footer>
    </main>
</body>
</html>
